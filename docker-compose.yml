# Local PostgreSQL for development. Values come from the root .env (copy .env.example).
services:
  db:
    image: postgres:16-alpine
    container_name: salon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SALON_DB_NAME:-salon}
      POSTGRES_USER: ${SALON_DB_USER:-salon}
      POSTGRES_PASSWORD: ${SALON_DB_PASSWORD:?Set SALON_DB_PASSWORD in the root .env file}
    ports:
      - "${SALON_DB_PORT:-55432}:5432"
    volumes:
      - salon-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  salon-db-data:
