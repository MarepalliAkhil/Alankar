<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f8f6ff;font-family:Arial,Helvetica,sans-serif;color:#1e1b4b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;padding:32px;">
            <tr><td style="font-size:22px;font-weight:bold;padding-bottom:16px;">{{ shop_name }}</td></tr>
            <tr><td style="font-size:16px;font-weight:bold;padding-bottom:12px;">{{ subject }}</td></tr>
            <tr><td style="font-size:15px;line-height:1.5;padding-bottom:20px;">{{ body|linebreaksbr }}</td></tr>
            {% if link %}
            <tr>
              <td style="padding-bottom:20px;">
                <a href="{{ link }}" style="display:inline-block;background:#7c3aed;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:bold;">{{ button_label }}</a>
              </td>
            </tr>
            <tr><td style="font-size:12px;color:#5b5675;padding-bottom:20px;">If the button does not work, copy this link into your browser:<br>{{ link }}</td></tr>
            {% endif %}
            <tr><td style="font-size:12px;color:#5b5675;">{{ footer }}</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
