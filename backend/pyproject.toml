[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*/migrations/*", ".venv", "venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]

[tool.ruff.lint.isort]
known-first-party = [
  "config", "core", "accounts", "people", "scheduling",
  "billing", "inventory", "chat", "marketing",
]
