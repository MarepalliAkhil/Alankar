[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*/migrations/*", ".venv", "venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
# These tests reuse the fixtures of the booking tests by importing them.
"billing/tests/*" = ["F401", "F811"]
"scheduling/tests/test_desk.py" = ["F401", "F811"]
"scheduling/tests/test_desk_customers.py" = ["F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = [
  "config", "core", "accounts", "people", "scheduling",
  "billing", "inventory", "chat", "marketing", "website",
]
