# Checks on every push and pull request (docs/DEPLOY.md). No secrets are used.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # The official image ships the contrib extensions, btree_gist included.
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: salon
          POSTGRES_USER: salon
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salon -d salon"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SALON_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdefghijklmnop
      SALON_FIELD_KEY: Y2ktb25seS1maWVsZC1rZXktMzItYnl0ZXMtbG9uZyE=
      SALON_DEBUG: "true"
      SALON_DB_NAME: salon
      SALON_DB_USER: salon
      SALON_DB_PASSWORD: ci-only-password
      SALON_DB_HOST: 127.0.0.1
      SALON_DB_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test -- --maxWorkers=2 --minWorkers=1
      - name: Build
        env:
          VITE_SITE_URL: https://example.invalid
        run: npm run build
