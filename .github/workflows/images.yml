# Builds the two production images and pushes them to GitHub Container Registry (docs/DEPLOY.md).
# Runs on a push to main and by hand (Actions > Images > Run workflow). It never deploys: on the
# VM, run scripts/deploy/deploy.sh <commit SHA> when you are ready.
# SITE_URL is a repository VARIABLE (Settings > Secrets and variables > Actions > Variables),
# not a secret: it is public (it is in every page and the sitemap).
name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: marepalliakhil

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: alankar-backend
            dockerfile: backend/Dockerfile
          - name: alankar-web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Check SITE_URL
        if: matrix.name == 'alankar-web' && vars.SITE_URL == ''
        run: |
          echo "Set the repository variable SITE_URL (for example https://alankar-akhil.centralindia.cloudapp.azure.com)."
          exit 1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
            VITE_BUSINESS_NAME=${{ vars.VITE_BUSINESS_NAME }}
            VITE_BUSINESS_PHONE=${{ vars.VITE_BUSINESS_PHONE }}
            VITE_BUSINESS_EMAIL=${{ vars.VITE_BUSINESS_EMAIL }}
            VITE_BUSINESS_STREET=${{ vars.VITE_BUSINESS_STREET }}
            VITE_BUSINESS_CITY=${{ vars.VITE_BUSINESS_CITY }}
            VITE_BUSINESS_REGION=${{ vars.VITE_BUSINESS_REGION }}
            VITE_BUSINESS_POSTAL_CODE=${{ vars.VITE_BUSINESS_POSTAL_CODE }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
