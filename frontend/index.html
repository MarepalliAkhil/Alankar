<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7C3AED" />
    <title>Loading…</title>
    <style>
      /* Before the app's code arrives: a quiet loader that appears only after 300 ms, in the
         browser's own light or dark colours (no fixed colours here; the themes load with the app).
         React replaces it as soon as the first page renders. */
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: Canvas;
        color: CanvasText;
        color-scheme: light dark;
        opacity: 0;
        animation: boot-in 260ms ease 300ms forwards;
      }
      .boot svg {
        width: 56px;
        height: 56px;
        animation: boot-spin 1.2s linear infinite;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <circle
            cx="24"
            cy="24"
            r="18"
            fill="none"
            stroke="currentColor"
            stroke-opacity="0.2"
            stroke-width="4"
          />
          <path
            d="M24 6a18 18 0 0 1 18 18"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
            stroke-linecap="round"
          />
        </svg>
      </div>
    </div>
    <noscript>Please enable JavaScript to use this site.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
